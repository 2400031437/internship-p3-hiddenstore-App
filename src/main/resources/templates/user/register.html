<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container my-4">
<div th:replace="~{fragments :: alerts}"></div>
<div class="card mx-auto" style="max-width:560px"><div class="card-body">
  <h3>User Registration</h3>
  <form th:action="@{/user/register}" method="post" enctype="multipart/form-data">
    <div class="mb-2"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
    <div class="mb-2"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
    <div class="mb-2"><label class="form-label">User image</label><input class="form-control" type="file" name="image" accept="image/*"></div>
    <div class="mb-2"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
    <div class="mb-2"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" required></div>
    <div class="mb-2"><label class="form-label">Address</label><input class="form-control" name="address"></div>
    <div class="mb-3"><label class="form-label">Contact number</label><input class="form-control" name="mobile"></div>
    <button class="btn btn-primary w-100" type="submit">Register</button>
    <p class="mt-3 mb-0">Already have an account? <a th:href="@{/user/login}">Login</a></p>
  </form>
</div></div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
