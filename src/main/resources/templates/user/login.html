<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('User login')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container my-4">
<div th:replace="~{fragments :: alerts}"></div>
<div class="card mx-auto" style="max-width:440px"><div class="card-body">
  <h3>User Login</h3>
  <form th:action="@{/user/login}" method="post">
    <div class="mb-2"><label class="form-label">Username or email</label><input class="form-control" name="username" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100" type="submit">Login</button>
    <p class="mt-3 mb-0">Don't have an account? <a th:href="@{/user/register}">Register</a></p>
  </form>
</div></div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
