<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Confirm payment')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container my-4">
<div th:replace="~{fragments :: alerts}"></div>
<div class="card mx-auto" style="max-width:480px"><div class="card-body">
  <h3>Confirm payment</h3>
  <form th:action="@{/user/orders/{id}/confirm(id=${order.id})}" method="post">
    <div class="mb-2"><label class="form-label">Invoice number</label><input class="form-control" th:value="${order.invoiceNumber}" readonly></div>
    <div class="mb-2"><label class="form-label">Amount</label><input class="form-control" th:value="${#numbers.formatDecimal(order.amountDue,1,2)}" readonly></div>
    <div class="mb-3"><label class="form-label">Payment mode</label>
      <select class="form-select" name="paymentMode" required>
        <option value="">Select payment mode</option>
        <option>UPI</option><option>Netbanking</option><option>Paypal</option><option>Cash on Delivery</option><option>Pay Offline</option>
      </select></div>
    <button class="btn btn-success w-100" type="submit">Confirm</button>
  </form>
</div></div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
