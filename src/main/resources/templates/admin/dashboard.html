<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin dashboard')}"></head>
<body>
<nav th:replace="~{fragments :: adminnav}"></nav>
<div class="container my-4">
<div th:replace="~{fragments :: alerts}"></div>
<h3 class="mb-3">Admin dashboard</h3>
<div class="row g-3">
  <div class="col-6 col-md-4 col-lg-2" th:each="s : ${stats}">
    <div class="card text-center"><div class="card-body">
      <div class="display-6" th:text="${s.value}">0</div><div class="text-muted" th:text="${s.key}">Name</div>
    </div></div>
  </div>
</div>
<p class="mt-4 text-muted">Use the menu above to insert / view / edit / delete products, categories and brands, and to see orders, payments and users.</p>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
